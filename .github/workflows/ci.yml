name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

# The tests write to target/test-state and the demos launch subprocesses, so two runs of
# the same branch must not overlap.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Build and test
        run: mvn -B --no-transfer-progress verify

      # The suite runs against src/test/resources/application.yml, so a broken shipped
      # default would not fail it. ShippedConfigTest covers the parse; this covers the
      # thing that test cannot: that the packaged jar actually starts.
      - name: The packaged jar starts and speaks the protocol
        run: |
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"server/discover","params":{}}' \
            | timeout 60 java -jar target/toolgate-*.jar \
                --spring.profiles.active=stdio \
                --spring.config.additional-location=demo/subscriptions/ \
                2>/dev/null > /tmp/out.txt || true
          echo "--- stdout ---"; cat /tmp/out.txt
          python3 - <<'PY'
          import json, sys
          lines = [l for l in open("/tmp/out.txt") if l.strip()]
          assert lines, "the jar produced nothing on stdout"
          # stdout must be protocol-only: one valid JSON-RPC message per line, no log lines.
          for line in lines:
              json.loads(line)
          print(f"ok: {len(lines)} valid JSON-RPC line(s), no log output on stdout")
          PY

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/

  demos:
    # The demos are the live tests that found five defects the unit tests missed, so they
    # run in CI rather than only when someone remembers to.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Package
        run: mvn -B --no-transfer-progress -q package -DskipTests

      - name: Elicitation guard refuses a phishing server
        run: |
          {
            echo '{"jsonrpc":"2.0","id":0,"method":"tools/list","params":{}}'
            sleep 1
            for t in harvest_key harvest_hidden phish_url ask_name; do
              echo "{\"jsonrpc\":\"2.0\",\"id\":\"$t\",\"method\":\"tools/call\",\"params\":{\"name\":\"phisher__$t\",\"arguments\":{}}}"
            done
            sleep 4
          } | timeout 90 java -jar target/toolgate-*.jar --spring.profiles.active=stdio \
                --spring.config.additional-location=demo/elicitation/ 2>/dev/null > /tmp/elicit.txt
          python3 - <<'PY'
          import json
          blocked, passed = set(), set()
          for line in open("/tmp/elicit.txt"):
              if not line.strip():
                  continue
              m = json.loads(line)
              if m.get("id") in (0, None):
                  continue
              (blocked if "error" in m else passed).add(m["id"])
          assert {"harvest_key", "harvest_hidden", "phish_url"} <= blocked, f"not blocked: {blocked}"
          assert "ask_name" in passed, "a legitimate name/email request was refused"
          print("ok: 3 attacks blocked, the legitimate request passed")
          PY

      - name: Subscription fan-out rewrites ids and refuses cross-stream injection
        run: |
          {
            echo '{"jsonrpc":"2.0","id":1,"method":"resources/list","params":{}}'
            sleep 2
            echo '{"jsonrpc":"2.0","id":"client-99","method":"subscriptions/listen","params":{"notifications":{"toolsListChanged":true,"resourceSubscriptions":["file:///a/one.md","file:///b/one.md","file:///etc/shadow"]}}}'
            sleep 7
          } | timeout 90 java -jar target/toolgate-*.jar --spring.profiles.active=stdio \
                --spring.config.additional-location=demo/subscriptions/ 2>/dev/null > /tmp/subs.txt
          python3 - <<'PY'
          import json
          ids, methods = set(), []
          for line in open("/tmp/subs.txt"):
              if not line.strip():
                  continue
              m = json.loads(line)
              if "result" in m:
                  continue
              methods.append(m["method"])
              ids.add((m.get("params") or {}).get("_meta", {})
                      .get("io.modelcontextprotocol/subscriptionId"))
          assert ids == {"client-99"}, f"upstream id leaked to the client: {ids}"
          assert "notifications/prompts/list_changed" not in methods, "filter not enforced"
          print(f"ok: {len(methods)} notification(s), all carrying the client's own id")
          PY
