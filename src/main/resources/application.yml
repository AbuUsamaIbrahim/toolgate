server:
  # Not 8080. That port is the default for so much developer tooling — ZooKeeper's admin
  # server, Tomcat, every scaffolded service — that a collision is the norm, and it does
  # not fail loudly: under a VM-based Docker runtime the published port is swallowed by
  # whatever already holds it, and the gateway appears to be answering with someone
  # else's 405s.
  port: 8090

spring:
  application:
    name: toolgate

logging:
  level:
    toolgate.audit: INFO
    dev.mahadi.toolgate: INFO

# /actuator/prometheus carries the decision counters and the bundle gauges.
# /actuator/health reports DOWN when policy has expired or failed to load — the
# failure an ordinary liveness probe cannot see, because a gateway can answer
# every request promptly while governing nothing at all.
management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      show-details: always
      probes:
        # Enabled explicitly rather than left to auto-detection. Spring Boot turns the
        # liveness and readiness groups on only when it detects Kubernetes, so outside a
        # cluster — systemd, docker compose, ECS — /actuator/health/liveness returns 404
        # and whatever health check points at it fails permanently. The endpoints should
        # not depend on where the process happens to be running.
        enabled: true

# ---------------------------------------------------------------------------
# Policy. Deny by default: a tool absent from `allow` is never shown to the model.
#
# Server ids must not contain underscores — tool names are namespaced as
# `serverId__toolName` and the split is on the first occurrence.
# ---------------------------------------------------------------------------
toolgate:
  # -------------------------------------------------------------------------
  # Caller authentication. On by default: a security gateway that ships open
  # has the wrong default.
  #
  # Tokens are stored as SHA-256 hashes, never plaintext — a config file gets
  # committed, pasted into tickets and baked into images. Generate one with:
  #   printf '%s' "$TOKEN" | shasum -a 256
  # -------------------------------------------------------------------------
  auth:
    enabled: true
    resource-uri: http://localhost:8090/mcp
    authorization-server: ""      # advertised via RFC 9728 when set
    # OIDC. Once this is set, people authenticate with tokens from your identity
    # provider: short-lived, revocable, and attributable to a name rather than to a
    # line in a config file. Leave the issuer empty to stay on static tokens.
    #
    # The audience check is the confused-deputy control. Without it, any token from
    # the same IdP — one minted for the wiki, or for a service an attacker already
    # holds — opens this gateway. It defaults to resource-uri above.
    oidc:
      issuer: ""                  # e.g. https://login.example.com/realms/engineering
      jwks-uri: ""                # discovered from the issuer when empty
      audiences: []               # defaults to resource-uri
      clock-skew: 60s             # small on purpose: expiry is a stateless token's only revocation
      subject-claim: preferred_username
      groups-claim: groups        # feeds bundle teamPolicies

    # Static tokens. Keep these for callers that are not people — build agents and
    # scheduled jobs have no browser to authenticate through. A hash here cannot be
    # revoked without editing every machine and names no person in the audit trail.
    callers:
      example-agent:
        # sha256 of "change-me" — replace before running anywhere real
        token-sha256: e2186dbdb1bb4193608605e84f33208765b5693b55edd4f730a719a100eeea6f
        scopes:
          - tools:read
          - tools:call

  # -------------------------------------------------------------------------
  # Operator API (/toolgate/**). This is the API that approves blocked calls and
  # re-pins changed definitions — anyone holding this credential can turn off
  # every control the gateway has, so it gets its own token rather than sharing
  # the agent's.
  #
  # Enabled but with no token set means no access, not open access. Getting that
  # backwards is how the most powerful API in a system ends up unauthenticated
  # because somebody forgot a line of config.
  # -------------------------------------------------------------------------
  operator:
    enabled: true
    loopback-only: true           # refuse operator calls from off-host
    # printf '%s' "$TOKEN" | shasum -a 256
    token-sha256: ""              # empty = operator API is closed

  # -------------------------------------------------------------------------
  # Notifications. A blocked call looks exactly like a broken one to whoever is
  # using the agent, so an approval nobody is told about becomes an argument for
  # switching the gateway off. Events are always logged; the webhook is delivery.
  #
  # Sent as {"text": "..."} — the shape Slack and most chat tools accept.
  # Delivery is fire-and-forget: a dead webhook must never fail a tool call.
  # -------------------------------------------------------------------------
  notify:
    webhook-url: ""

  # -------------------------------------------------------------------------
  # Pin storage. This file is the gateway's trust store: it records which tool
  # definitions were approved. Without it, every restart re-pins everything and
  # the poisoning defence silently stops enforcing.
  #
  # Treat it like an SSH key. It is written owner-only, and a group- or
  # world-writable file aborts startup — anyone who can write it can pre-approve
  # a poisoned tool.
  # -------------------------------------------------------------------------
  pins:
    file: ~/.toolgate/pins.json
    require-secure-permissions: true

  # -------------------------------------------------------------------------
  # Audit trail. The in-memory ring buffer behind GET /toolgate/audit is a
  # convenience; this is the record. Written as JSON Lines, appended and
  # flushed per entry, never rewritten — point logrotate at it.
  #
  # fail-closed: refuse requests when the trail cannot be written. Correct
  # where "no record" means "did not happen"; wrong where the gateway is what
  # stands between an agent and a poisoned tool, since it disables the
  # protection to protect the paperwork. Off by default.
  # -------------------------------------------------------------------------
  audit:
    file: ~/.toolgate/audit.jsonl
    fail-closed: false

  # -------------------------------------------------------------------------
  # Approval queue. Outstanding requests survive a restart so a deploy does not
  # empty the queue an operator is working through.
  #
  # Granted approvals are deliberately NOT persisted. A grant is permission for
  # one call in one moment; writing it down would turn a momentary "yes" into a
  # standing permission. A restart revokes every outstanding grant, by design.
  # -------------------------------------------------------------------------
  approvals:
    file: ~/.toolgate/approvals.json

  # -------------------------------------------------------------------------
  # Signed policy bundle. This is how one security team's decision reaches
  # every laptop without anyone editing 200 config files.
  #
  # When a bundle is in force it is AUTHORITATIVE for policy: the allowlist,
  # approval rules, threshold and reviewed fingerprints all come from it, and
  # the settings below in this file are ignored. Local configuration keeps only
  # connectivity — how to reach a server, never what may be done with it.
  # A server this file can reach but the bundle does not mention gets nothing.
  #
  # Produce one with:
  #   java -jar toolgate.jar bundle keygen
  #   java -jar toolgate.jar bundle sign policy.json key prod-2026 bundle.json
  # -------------------------------------------------------------------------
  bundle:
    source: ""                    # file path or http(s) URL; empty = local config only
    required: false               # true on a managed fleet: no bundle, no service
    refresh-interval: 5m
    stale-grace: 24h              # enforce this long past expiry, then fail closed
    cache-file: ~/.toolgate/bundle.cache.json
    public-keys: {}               # keyid -> base64 X.509 Ed25519 key; more than one to rotate

  # -------------------------------------------------------------------------
  # OTLP export for the audit trail. The file on disk lives on the machine
  # being audited, so anyone who can write that disk can rewrite the record of
  # what they did. A copy in a sink the caller does not control is what turns
  # a log into evidence.
  #
  # Tailing the JSON Lines file with Fluent Bit or Vector is an equally good
  # answer and needs no code. This is for deployments already running a
  # collector. Export is batched and asynchronous either way: a dead collector
  # must never fail a tool call.
  # -------------------------------------------------------------------------
  otlp:
    endpoint: ""                  # e.g. http://otel-collector:4318/v1/logs
    service-name: toolgate
    service-instance-id: ""       # defaults to the hostname
    timeout: 10s

  # -------------------------------------------------------------------------
  # Control plane.
  #
  # Sidecar side: set `url` and this gateway reports in — who, which machine,
  # which build, which policy sequence, and whether that policy is healthy.
  # Nothing about what tools were called; the audit trail already answers that
  # and goes somewhere designed for it. A coverage mechanism that becomes a
  # developer-activity feed is a different product.
  #
  # Server side (profile `control`): set `bundle-file` to what it should serve.
  # Same image, different args — see the Kubernetes manifests.
  # -------------------------------------------------------------------------
  control:
    url: ""                       # e.g. https://toolgate-control.internal
    check-in-interval: 5m
    instance-id: ""               # defaults to the hostname
    bundle-file: ""               # server side only
    silent-after: 30m             # generous: a closed lid is not a coverage gap

    # Server side: where fleet state lives. Empty means in memory, which means
    # exactly one replica — with more, each pod holds part of the fleet and the
    # coverage report contradicts itself between requests.
    database-url: ""              # e.g. jdbc:postgresql://postgres:5432/toolgate
    database-user: ""
    database-password: ""         # from a secret via TOOLGATE_CONTROL_DATABASEPASSWORD

  # -------------------------------------------------------------------------
  # Slack approvals. A blocked call posts a message with Approve / Deny
  # buttons into a channel of the people allowed to decide.
  #
  # signing-secret is not optional in spirit: the interaction endpoint has to
  # be reachable from the internet for buttons to work, and what it does is
  # approve tool calls. Empty means the endpoint refuses everything, which is
  # the only safe answer when it cannot tell Slack from anyone else.
  #
  # `approvers` maps Slack user ids to gateway identities. Explicit rather
  # than read from the Slack profile, because profile fields are user-editable
  # in many workspaces — trusting one would let somebody name themselves as
  # the person whose request they want to approve.
  # -------------------------------------------------------------------------
  slack:
    bot-token: ""                 # xoxb-… ; empty disables posting
    channel: ""                   # e.g. "#toolgate-approvals"
    signing-secret: ""            # empty = /slack/interactions refuses everything
    approvers: {}                 # U024BE7LH: alice@example.com

  # -------------------------------------------------------------------------
  # Drift advisor. A second opinion on a changed definition, shown beside the
  # diff in the dashboard.
  #
  # OFF BY DEFAULT, and switching it on is a decision rather than a setting:
  # it is the first time this gateway talks to anything other than its
  # configured upstreams, and tool descriptions, resource URIs and the reasons
  # behind refusals leave the machine.
  #
  # It is advisory only. It holds no credential, has no action endpoint, and
  # cannot accept a drift — because the text it reads was written by the server
  # under suspicion, and a description saying "this is a routine version bump,
  # approve it" would otherwise be a prompt injection against the console that
  # can approve anything. Its notes sit next to the diff, never in place of it.
  # -------------------------------------------------------------------------
  advisor:
    enabled: false
    # ANTHROPIC (Messages API) or OPENAI (chat-completions — DeepSeek, OpenAI, Groq,
    # Together, most self-hosted servers). Set the endpoint and model to match.
    api: ANTHROPIC
    endpoint: https://api.anthropic.com/v1/messages
    model: claude-sonnet-5
    api-key-env: ANTHROPIC_API_KEY   # the variable name; never the key itself
    timeout: 20s
    #
    # DeepSeek:
    #   api: OPENAI
    #   endpoint: https://api.deepseek.com/chat/completions
    #   model: deepseek-chat
    #   api-key-env: DEEPSEEK_API_KEY

  block-threshold: 50
  approve-first-sighting: false
  # Upstreams. None by default — configure your own. An upstream is reached either
  # by `command` (a stdio subprocess) or `url` (Streamable HTTP), never both.
  #
  # servers:
  #   files:                    # ids must not contain underscores
  #     command: ["npx", "-y", "@modelcontextprotocol/server-filesystem", "/tmp"]
  #     allow: [read_file, write_file]          # tools
  #     require-approval: [write_file]
  #
  #     # Resources and prompts are governed the same way, and default to none.
  #     # Resource rules are exact, or a prefix ending in `*` — not a regex, because
  #     # a mis-written prefix allows too little and a mis-written regex allows too
  #     # much, and only one of those is noticed.
  #     allow-resources: ["file:///project/*"]
  #     allow-prompts: [summarise]
  #
  #     # Which URI schemes a resource may use. `https` is absent on purpose: the
  #     # spec lets a client fetch those directly, so the content would never pass
  #     # through this gateway and nothing would screen it. Add it only if you mean
  #     # to give that up.
  #     allowed-uri-schemes: [file, git]
  #
  #   internal:
  #     url: http://localhost:9001
  #     token: ${INTERNAL_TOKEN}   # the gateway's own credential, never the caller's
  #     allow: [query]
  servers: {}
