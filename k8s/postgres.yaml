---
apiVersion: v1
kind: Secret
metadata:
  name: pg-secret
type: Opaque
stringData:
  # stringData lets you write plaintext; Kubernetes base64-encodes it on write.
  POSTGRES_PASSWORD: lab-password
  POSTGRES_USER: toolgate
  POSTGRES_DB: toolgate
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pg-data
spec:
  # ReadWriteOnce = mountable by one node at a time. This is the constraint that
  # makes "just add replicas" wrong for a database, and the reason StatefulSets
  # give each replica its own volume rather than sharing one.
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
  # No storageClassName: the cluster's default is used. On kind that is
  # local-path-provisioner, which creates a directory on the node.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  replicas: 1
  strategy:
    # Recreate, not RollingUpdate. A rolling update would try to start a second
    # pod before stopping the first, and both would want the same RWO volume —
    # the new one would sit Pending forever with a FailedAttachVolume event.
    type: Recreate
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          envFrom:
            - secretRef: { name: pg-secret }
          env:
            # Postgres refuses to initialise into a non-empty directory, and the
            # mount root contains lost+found on many volume types. A subdirectory
            # avoids the classic "directory not empty" crash loop.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - { name: postgres, containerPort: 5432 }
          readinessProbe:
            # pg_isready, not a TCP check. Postgres accepts connections while it
            # is still recovering, so a port check reports ready too early.
            exec:
              command: ["pg_isready", "-U", "toolgate", "-d", "toolgate"]
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "toolgate", "-d", "toolgate"]
            initialDelaySeconds: 30
            periodSeconds: 20
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: pg-data
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector: { app: postgres }
  ports:
    - { name: postgres, port: 5432, targetPort: postgres }
