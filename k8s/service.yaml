apiVersion: v1
kind: Service
metadata:
  name: toolgate-control
  namespace: toolgate
  labels:
    app.kubernetes.io/name: toolgate-control
spec:
  # ClusterIP: reachable inside the cluster, and from a laptop via port-forward. Exposing
  # it properly is an Ingress, which is roadmap stage 3.
  type: ClusterIP
  selector:
    # This must match the Pod template's labels exactly. A Service with a selector that
    # matches nothing is not an error — it is an empty endpoint list and a connection
    # refused, which is the single most common self-inflicted Kubernetes bug.
    app.kubernetes.io/name: toolgate-control
  ports:
    - name: http
      port: 80
      targetPort: http
